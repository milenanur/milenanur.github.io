     お問い合わせ

</h1>
<p class="contact-subtitle">
     制作のご相談やお仕事のご依頼など、お気軽にご連絡ください。
    </p>
</section>
<div class="contact-layout">
<section aria-labelledby="contact-message-title" class="contact-message">
<h2 class="section-title" id="contact-message-title">
      ご相談内容をお聞かせください
     </h2>
<p>
      Webデザイン・グラフィック制作・
      <br class="contact-desktop-break"/>
      動画編集についてもお気軽にご相談ください。
     </p>
<img alt="" class="contact-sakura" loading="lazy" src="images/decorations/sakura-vertical.svg"/>
</section>
<section aria-label="お問い合わせフォーム" class="contact-form-section">
<form action="https://formspree.io/f/mvkkdrrw" method="POST" class="contact-form" id="contact-form">
<div class="contact-field">
<label for="contact-name">
        お名前
        <span class="required">
         必須
        </span>
</label>
<input autocomplete="name" id="contact-name" maxlength="100" name="name" required="" type="text"/>
</div>
<div class="contact-field">
<label for="contact-email">
        メールアドレス
        <span class="required">
         必須
        </span>
</label>
<input autocomplete="email" id="contact-email" maxlength="254" name="email" required="" type="email"/>
</div>
<div class="contact-field">
<label for="contact-message">
        お問い合わせ内容
        <span class="required">
         必須
        </span>
</label>
<textarea id="contact-message" maxlength="5000" name="message" required="" rows="8"></textarea>
</div>
<p class="contact-privacy">
       ご入力いただいた個人情報は、お問い合わせへの対応にのみ使用します。
      </p>
<div class="contact-actions">
<button class="button button-pink contact-submit" type="submit">
       送信する
       <img alt="" src="images/icons/arrow-right.svg"/>
</button>
<div class="contact-social" aria-label="またはSNSでご連絡ください">
  <span class="contact-social-label">またはSNSでご連絡ください</span>
  <div class="contact-social-links">

<a class="contact-social-link" href="https://vk.ru/club242932789" target="_blank" rel="noopener noreferrer" aria-label="VK" title="VK"><img src="images/icons/vk-svgrepo-com.svg" alt="" width="48" height="48"/></a>
  </div>
</div>
</div>

</p>
